name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosuto/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Generate Android Project & Setup Files
        run: |
          flutter create . --project-name general_store_pos --org com.generalstore.pos
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Set Android Camera & Min SDK
        run: |
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk =.*/minSdk = 23/g' android/app/build.gradle || true
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <application/g' android/app/src/main/AndroidManifest.xml || true

      - name: Fix Kotlin Version & Setup Keystore
        run: |
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.8.22'/g" android/build.gradle || true
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Google Services XML
        run: |
          python3 -c '
          import json, os
          p = "android/app/google-services.json"
          if os.path.exists(p):
              d = json.load(open(p))
              c = d["client"][0]
              pi = d["project_info"]
              web_id = next((o["client_id"] for o in c.get("oauth_client", []) if o.get("client_type") == 3), "")
              if not web_id:
                  web_id = next((o["client_id"] for o in c.get("services", {}).get("appinvite_service", {}).get("other_platform_oauth_client", []) if o.get("client_type") == 3), "")
              xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">{web_id}</string>
              <string name="google_app_id" translatable="false">{c["client_info"]["mobilesdk_app_id"]}</string>
              <string name="google_api_key" translatable="false">{c["api_key"][0]["current_key"]}</string>
              <string name="google_crash_reporting_api_key" translatable="false">{c["api_key"][0]["current_key"]}</string>
              <string name="project_id" translatable="false">{pi["project_id"]}</string>
              <string name="gcm_defaultSenderId" translatable="false">{pi["project_number"]}</string>
              <string name="google_storage_bucket" translatable="false">{pi.get("storage_bucket", "")}</string>
          </resources>"""
              os.makedirs("android/app/src/main/res/values", exist_ok=True)
              open("android/app/src/main/res/values/googleservices.xml", "w").write(xml)
          ' || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
